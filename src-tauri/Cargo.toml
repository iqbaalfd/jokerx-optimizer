[package]
name = "jokerx-optimizer"
version = "0.1.0"
description = "Advanced System Optimizer And Hardware Monitoring Utility"
authors = ["Iqbal Fadillah"]
edition = "2021"



[lib]
name = "jokerx_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-shell = "2"
sysinfo = "0.30"
